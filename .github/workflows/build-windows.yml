name: 编译 Windows EXE

on:

  workflow_dispatch:

  push:

    branches: [main, master]

jobs:

  build:

    runs-on: windows-latest

    steps:

      - name: 获取项目源码

        uses: actions/checkout@v4

      - name: 配置 Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 20

      - name: 解压项目源码

        shell: pwsh

        run: |

          New-Item -ItemType Directory -Force -Path source | Out-Null

          $zip = Get-ChildItem -Path . -File -Filter "*.zip" | Select-Object -First 1

          if (-not $zip) {

            throw "没有找到项目 ZIP 压缩包"

          }

          Write-Host "找到压缩包：$($zip.Name)"

          Expand-Archive -LiteralPath $zip.FullName -DestinationPath source -Force

          $package = Get-ChildItem -Path source -Filter "package.json" -Recurse -File | Select-Object -First 1

          if (-not $package) {

            throw "解压后没有找到 package.json"

          }

          $project = $package.Directory.FullName

          Write-Host "项目目录：$project"

          "PROJECT_DIR=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 修复安装程序配置

        shell: pwsh

        run: |

          $p = Join-Path $env:PROJECT_DIR "package.json"

          $j = Get-Content -LiteralPath $p -Raw | ConvertFrom-Json

          if (-not $j.build.nsis) {

            throw "没有找到 package.json 中的 build.nsis 配置"

          }

          $j.build.nsis.oneClick = $false

          $json = $j | ConvertTo-Json -Depth 100

          [System.IO.File]::WriteAllText(

            $p,

            $json,

            [System.Text.UTF8Encoding]::new($false)

          )

      - name: 安装项目依赖

        shell: pwsh

        run: |

          Set-Location $env:PROJECT_DIR

          npm install

      - name: 编译 Windows EXE

        shell: pwsh

        run: |

          Set-Location $env:PROJECT_DIR

          npm run dist

      - name: 上传 EXE 文件

        uses: actions/upload-artifact@v4

        with:

          name: 轻账本-Windows-EXE

          path: source/**/dist/*

          if-no-files-found: error

          retention-days: 7
